name: kanban-php

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:?Создайте .env командой php bin/console init}
      POSTGRES_USER: ${DB_USER:?Создайте .env командой php bin/console init}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Создайте .env командой php bin/console init}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 15

  php:
    image: kanban-php:local
    build: .
    env_file: .env
    command: ["sh", "-c", "php bin/console migrate && exec php-fpm"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 3s
      timeout: 2s
      retries: 15

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8082}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy

  cron:
    image: kanban-php:local
    pull_policy: never
    command: ["cron", "-f"]
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      php:
        condition: service_healthy

volumes:
  postgres-data:
