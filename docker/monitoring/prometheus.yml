global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: kanban
    static_configs:
      - targets: ["nginx:8081"]

  - job_name: kanban-health
    metrics_path: /probe
    params:
      module: [kanban_ready]
      target: ["http://nginx/health"]
    static_configs:
      - targets: ["blackbox-exporter:9115"]
